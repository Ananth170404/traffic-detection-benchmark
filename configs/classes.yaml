# Original 12 classes from Roboflow-100 "vehicles" (vehicles-q0x2v v2), in label-id order.
original:
  - big bus
  - big truck
  - bus-l-
  - bus-s-
  - car
  - mid truck
  - small bus
  - small truck
  - truck-l-
  - truck-m-
  - truck-s-
  - truck-xl-

# Evidence in notebooks/01_eda.ipynb: the two naming schemes (big/mid/small vs -s-/-m-/-l-/-xl-)
# co-occur in 1,096 images, describe the same size scale, and overlap heavily in box size;
# several sub-classes have 0-31 test instances.
merged:
  names: [car, bus, truck]
  mapping:
    car: car
    big bus: bus
    bus-l-: bus
    bus-s-: bus
    small bus: bus
    big truck: truck
    mid truck: truck
    small truck: truck
    truck-l-: truck
    truck-m-: truck
    truck-s-: truck
    truck-xl-: truck

# Passenger car units used for flow in Phase 3/4.
pcu:
  car: 1.0
  bus: 3.0
  truck: 3.0
