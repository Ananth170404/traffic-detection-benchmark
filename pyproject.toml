[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tdb"
version = "0.1.0"
description = "Traffic detection benchmark (HOG+SVM, CNN, Faster R-CNN, RetinaNet, YOLO) and adaptive signal timing"
authors = [{ name = "Ananth Shyam" }]
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pyyaml",
    "opencv-python",
    "matplotlib",
    "pandas",
    "tqdm",
]

[project.optional-dependencies]
train = [
    "torch",
    "torchvision",
    "ultralytics",
    "pycocotools",
    "scikit-learn",
    "scikit-image",
    "roboflow",
]
demo = ["gradio", "onnxruntime"]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
